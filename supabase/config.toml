# Supabase 프로젝트 설정 (Edge Functions만 사용 중)
# project_id는 로컬 식별용 이름이다. 실제 연결은 `supabase link --project-ref`로 한다.
project_id = "naengteol-ai"

[functions.analyze-fridge]
# 새 publishable 키는 JWT가 아니라서 기본 JWT 검사를 끄고,
# 함수 안에서 apikey 헤더를 APP_KEY와 직접 비교한다.
verify_jwt = false

[functions.explain-recipe]
verify_jwt = false
